[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
  "lockscreen-widget-clock",
  "lockscreen-login-box@eDP-1",
  "lockscreen-widget-date",
  "lockscreen-widget-quote"
]

[lockscreen_widgets.grid]
cell_size = 8
major_interval = 4
visible = true

# === Login Box ===
[lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
box_height = 128.0
box_width = 720.0
cx = 968.0
cy = 660.0
output = "eDP-1"
placement_height = 1080.0
placement_width = 1920.0
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
background_color = "surface_container"
background_opacity = 0.88
background_radius = 15.0
center_password_text = true
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = false
show_password_reveal = true
show_session_buttons = true
show_unlock_hint = true
show_weather = false

# === Main Clock ===
[lockscreen_widgets.widget.lockscreen-widget-clock]
box_height = 192.0
box_width = 760.0
cx = 960.0
cy = 412.0
output = "eDP-1"
placement_height = 1080.0
placement_width = 1920.0
rotation = 0.0
type = "clock"

[lockscreen_widgets.widget.lockscreen-widget-clock.settings]
background = false
clock_style = "digital"
color = "primary"
font_family = ""
format = "{:%H:%M:%S}"

# === Date Clock ===
[lockscreen_widgets.widget.lockscreen-widget-date]
box_height = 32.0
box_width = 256.0
cx = 960.0
cy = 500.0
output = "eDP-1"
placement_height = 1080.0
placement_width = 1920.0
rotation = 0.0
type = "clock"

[lockscreen_widgets.widget.lockscreen-widget-date.settings]
background = false
clock_style = "digital"
format = "{:%a, %b %d }"

# === Quote ===
[lockscreen_widgets.widget.lockscreen-widget-quote]
box_height = 160.0
box_width = 392.0
cx = 224.0
cy = 108.0
output = "eDP-1"
placement_height = 1080.0
placement_width = 1920.0
rotation = -0.0
type = "label"

[lockscreen_widgets.widget.lockscreen-widget-quote.settings]
background = true
background_color = "primary"
background_opacity = 0.0
background_padding = 16
background_radius = 0

color = "primary"
description = "— Fang Yuan"
font_family = "JetBrainsMono NFM ExtraBold"
opacity = 1.0
shadow = false
title = "Heaven would never seal all of one’s paths!"
