[control_center]
sidebar = "compact"
sidebar_section = "compact"
hidden_tabs = [
  "audio",
  "monitor",
  "power",
]
show_session_button = true
show_shortcut_labels = false
width = 600

[control_center.calendar]
show_events_card = false

[control_center.media]
show_visualizer = false

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "dark_mode"
