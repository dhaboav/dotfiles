# === Left Widgets ===
[widget.workspaces]
active_pill_size = 1.0
inactive_pill_size = 1.0
font_scale = 1.0
hide_when_empty = true
pill_scale = 0.65
show_labels = false
show_tooltip = false
occupied_color = "primary_container"
change_color_on_hover = false

[widget.spacer1]
length = 25
type = "spacer"

[widget.taskbar]
group_single_icon_per_app = true
inactive_opacity = 0.4
only_active_workspace = true
show_active_indicator = false
show_tooltip = false

# === Center Widgets ===
[widget.clock]
interactive = false
anchor = true
capsule_foreground = "primary"
color = "primary"
font_weight = 700
format = "{:%-I:%M:%S %p} · {:%a %d}"

# === Right Widgets ===
# System monitoring
[widget.cpu]
interactive = false
show_tooltip = false
visualization = "none"

[widget.ram]
interactive = false
stat = "ram_pct"
visualization = "none"

# Network
[widget.network]
interactive = false
show_label = false
show_tooltip = false

[widget.network_rx]
interactive = false
glyph = "arrow-down"
network_speed_decimal_places = 0
network_speed_unit = "mb"
visualization = "none"

[widget.network_tx]
interactive = false
glyph = "arrow-up"
network_speed_unit = "mb"
visualization = "none"

# Audio
[widget.input_volume]
interactive = false
type = "volume"
device = "input"
show_label = false
mute_color = "primary"
hide_when_inactive = false

# Bluetooth
[widget.bluetooth]
interactive = false
hide_when_no_connected_device = false

# Battery
[widget.battery]
interactive = false
display_mode = "graphic"
